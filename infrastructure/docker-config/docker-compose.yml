services:

  java-backend:
    build:
      context: ../../services/persistence-java
      dockerfile: Dockerfile
    container_name: persistence-java
    ports:
      - "8080:8080"
    environment:
      # Variáveis de conexão com o Banco de Dados
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ecosortdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres-db
    networks:
      - public_network
      - private_network

  ai-python:
    build:
      context: ../../services/ai-python
      dockerfile: Dockerfile
    container_name: ai-python

  postgres-db:
    image: postgres:14-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: ecosortdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - private_network

  mqtt-broker:
    image: eclipse-mosquitto:2.0.15
    container_name: ecosort-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    networks:
      - private_network

  #react-web:
  #  build:
  #    context: ../frontend-react
  #    dockerfile: Dockerfile
  #  container_name: frontend-web
  #  ports:
  #    - "3000:80"
  #  networks:
  #    - public_network

volumes:
  postgres_data:
    driver: local

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge